<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; worker-src 'self'; manifest-src 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#2d9d77" />
    <meta name="description" content="Tap, move, stack, and nest big friendly pieces." />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../assets/icon-192.png" />
    <link rel="stylesheet" href="../../stack-settle.css" />
    <title>Stack &amp; Settle · SuperSimpleGames</title>
  </head>
  <body>
    <main class="stack-game">
      <header class="stack-topbar">
        <a class="stack-brand" href="../../" aria-label="All games">
          <span class="stack-brand-mark" aria-hidden="true">‹</span>
          <span>Stack &amp; Settle</span>
        </a>
        <button id="sound-toggle" class="stack-sound" type="button" aria-pressed="true" aria-label="Turn sound off">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-4v8a4.5 4.5 0 0 0 2-4Zm-2-7.7v2.1a6.5 6.5 0 0 1 0 11.2v2.1a8.5 8.5 0 0 0 0-15.4Z"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm11.5 3 2.2-2.2 1.4 1.4-2.2 2.2 2.2 2.2-1.4 1.4-2.2-2.2-2.2 2.2-1.4-1.4 2.2-2.2-2.2-2.2 1.4-1.4 2.2 2.2Z"/></svg>
        </button>
      </header>

      <section id="build-area" class="build-area" aria-label="Build area with five movable pieces">
        <div class="sky-cloud cloud-one" aria-hidden="true"></div>
        <div class="sky-cloud cloud-two" aria-hidden="true"></div>
        <div class="settle-floor" aria-hidden="true"></div>
        <div id="pieces" class="pieces"></div>
        <p id="stack-message" class="stack-message" aria-live="polite">Tap or move a piece!</p>
      </section>
      <div id="announcement" class="sr-only" aria-live="polite"></div>
    </main>
    <noscript>Stack &amp; Settle needs JavaScript to play.</noscript>
    <script type="module" src="../../src/stack-settle.js"></script>
  </body>
</html>
