<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; worker-src 'self'; manifest-src 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#5d3fd3" />
    <meta name="description" content="A bright, no-fail color garden made for curious little hands." />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../assets/icon-192.png" />
    <link rel="stylesheet" href="../../styles.css" />
    <title>Bloom · SuperSimpleGames</title>
  </head>
  <body>
    <main id="garden" class="garden">
      <header class="topbar">
        <a class="brand" href="../../" aria-label="All games">
          <span class="brand-mark" aria-hidden="true">‹</span>
          <span>Bloom</span>
        </a>
        <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="true" aria-label="Turn sound off">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-4v8a4.5 4.5 0 0 0 2-4Zm-2-7.7v2.1a6.5 6.5 0 0 1 0 11.2v2.1a8.5 8.5 0 0 0 0-15.4Z"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm11.5 3 2.2-2.2 1.4 1.4-2.2 2.2 2.2 2.2-1.4 1.4-2.2-2.2-2.2 2.2-1.4-1.4 2.2-2.2-2.2-2.2 1.4-1.4 2.2 2.2Z"/></svg>
        </button>
      </header>

      <section id="playfield" class="playfield" role="button" tabindex="0" aria-label="Bloom color garden. Tap anywhere to grow a flower.">
        <div class="hill hill-back" aria-hidden="true"></div>
        <div class="hill hill-front" aria-hidden="true"></div>
        <div id="blooms" class="blooms" aria-hidden="true"></div>
        <div id="invitation" class="invitation">
          <div class="invitation-flower" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
          </div>
          <p>Tap to grow!</p>
        </div>
      </section>
      <div id="announcement" class="sr-only" aria-live="polite"></div>
    </main>
    <noscript>Bloom needs JavaScript to grow its garden.</noscript>
    <script type="module" src="../../src/app.js"></script>
  </body>
</html>
