<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; frame-src 'none'; form-action 'none'; connect-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; worker-src 'self'; manifest-src 'self'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#6449c9" />
    <meta name="description" content="Tap colors and fill the board in a bright, no-fail puzzle." />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../assets/icon-192.png" />
    <link rel="stylesheet" href="../../color-splash.css" />
    <title>Color Splash · SuperSimpleGames</title>
  </head>
  <body>
    <main class="splash-game">
      <header class="splash-topbar">
        <a class="splash-brand" href="../../" aria-label="All games">
          <span class="splash-brand-mark" aria-hidden="true">‹</span>
          <span>Color Splash</span>
        </a>
        <button id="sound-toggle" class="splash-sound" type="button" aria-pressed="true" aria-label="Turn sound off">
          <svg class="sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2-4v8a4.5 4.5 0 0 0 2-4Zm-2-7.7v2.1a6.5 6.5 0 0 1 0 11.2v2.1a8.5 8.5 0 0 0 0-15.4Z"/></svg>
          <svg class="sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm11.5 3 2.2-2.2 1.4 1.4-2.2 2.2 2.2 2.2-1.4 1.4-2.2-2.2-2.2 2.2-1.4-1.4 2.2-2.2-2.2-2.2 1.4-1.4 2.2 2.2Z"/></svg>
        </button>
      </header>

      <section class="board-shell" aria-labelledby="splash-prompt">
        <p id="splash-prompt" class="splash-prompt">Tap a color!</p>
        <div id="color-board" class="color-board" role="group" aria-label="Color squares. The sparkling top-left square grows."></div>
      </section>
      <div id="announcement" class="sr-only" aria-live="polite"></div>
    </main>
    <noscript>Color Splash needs JavaScript to play.</noscript>
    <script type="module" src="../../src/color-splash.js"></script>
  </body>
</html>
