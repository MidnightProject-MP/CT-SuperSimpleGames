<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5d3fd3" />
    <meta name="description" content="Big, bright, no-fail games made for curious little hands." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <link rel="stylesheet" href="./launcher.css" />
    <title>SuperSimpleGames</title>
  </head>
  <body>
    <main class="launcher">
      <header class="launcher-heading">
        <span class="launcher-mark" aria-hidden="true">✦</span>
        <div>
          <h1>SuperSimpleGames</h1>
          <p>Pick one and play!</p>
        </div>
      </header>

      <nav class="game-grid" aria-label="Choose a game">
        <a class="game-card bloom-card" href="./games/bloom/">
          <span class="card-art bloom-art" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
          </span>
          <span class="card-copy"><strong>Bloom</strong><small>Grow a garden</small></span>
        </a>

        <a class="game-card splash-card" href="./games/color-splash/">
          <span class="card-art splash-art" aria-hidden="true">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </span>
          <span class="card-copy"><strong>Color Splash</strong><small>Fill the board</small></span>
        </a>
      </nav>
    </main>
    <script type="module" src="./src/launcher.js"></script>
  </body>
</html>
